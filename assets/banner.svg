<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="OPBR — 前端工程师 / AI Agent 开发者">
  <defs>
    <!-- 底色 -->
    <linearGradient id="base" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#0c1230"/>
      <stop offset="1" stop-color="#070b18"/>
    </linearGradient>

    <!-- 漂移光斑 -->
    <radialGradient id="orbIndigo">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCyan">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbViolet">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- 标题渐变 -->
    <linearGradient id="titleFill" x1="80" y1="100" x2="480" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>

    <!-- 装饰线渐变 -->
    <linearGradient id="ruleFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <!-- 网格 -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8b9dc3" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <!-- 圆角裁剪 -->
    <clipPath id="frame">
      <rect x="0" y="0" width="1280" height="320" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#base)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>

    <!-- 三个漂移光斑：各自独立往返，形成呼吸感 -->
    <g>
      <circle cx="240" cy="90" r="220" fill="url(#orbIndigo)" opacity="0.55">
        <animate attributeName="cx" values="240;420;240" dur="14s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
        <animate attributeName="cy" values="90;170;90" dur="11s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </circle>
      <circle cx="1050" cy="230" r="240" fill="url(#orbCyan)" opacity="0.5">
        <animate attributeName="cx" values="1050;880;1050" dur="17s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
        <animate attributeName="cy" values="230;120;230" dur="13s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </circle>
      <circle cx="700" cy="40" r="180" fill="url(#orbViolet)" opacity="0.42">
        <animate attributeName="cx" values="700;560;700" dur="19s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
        <animate attributeName="cy" values="40;150;40" dur="15s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </circle>
    </g>

    <!-- 漂浮粒子 -->
    <g fill="#a5b4fc">
      <circle cx="120" cy="250" r="2.2" opacity="0.5">
        <animate attributeName="cy" values="250;150;250" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.75;0.15" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="330" cy="70" r="1.8" opacity="0.4">
        <animate attributeName="cy" values="70;200;70" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.7;0.1" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="900" cy="280" r="2" opacity="0.45">
        <animate attributeName="cy" values="280;160;280" dur="10.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.12;0.8;0.12" dur="10.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1180" cy="90" r="2.4" opacity="0.35">
        <animate attributeName="cy" values="90;230;90" dur="13.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.65;0.1" dur="13.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="620" cy="300" r="1.6" opacity="0.4">
        <animate attributeName="cy" values="300;190;300" dur="8.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.7;0.1" dur="8.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- 左侧主标题区 -->
    <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif">
      <text x="80" y="150" font-size="88" font-weight="800" letter-spacing="6" fill="url(#titleFill)">OPBR</text>

      <rect x="82" y="176" width="300" height="3" rx="1.5" fill="url(#ruleFill)">
        <animate attributeName="width" values="300;210;300" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </rect>

      <text x="82" y="214" font-size="26" font-weight="600" fill="#e2e8f0">前端工程师 × AI Agent 开发者</text>
      <text x="82" y="246" font-size="16" font-weight="400" fill="#8b9dc3" letter-spacing="0.6">Frontend Engineer · AI Agent Builder · Open Source</text>

      <!-- 状态指示点 -->
      <circle cx="86" cy="277" r="4.5" fill="#34d399">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="r" values="4.5;6;4.5" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="100" y="282" font-size="14" fill="#94a3b8">Open to collaborate · 欢迎交流合作</text>
    </g>

    <!-- 右下角装饰：脉冲同心弧 -->
    <g transform="translate(1120 160)" fill="none" stroke="#22d3ee">
      <circle r="34" stroke-opacity="0.35" stroke-width="1.2">
        <animate attributeName="r" values="34;72;34" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.35;0;0.35" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle r="52" stroke-opacity="0.22" stroke-width="1.1">
        <animate attributeName="r" values="52;92;52" dur="6s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.22;0;0.22" dur="6s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="70" stroke-opacity="0.14" stroke-width="1">
        <animate attributeName="r" values="70;112;70" dur="6s" begin="2.8s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.14;0;0.14" dur="6s" begin="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle r="7" fill="#22d3ee" fill-opacity="0.9" stroke="none"/>
    </g>

    <!-- 底部高光边 -->
    <rect x="0" y="316" width="1280" height="4" fill="url(#ruleFill)" opacity="0.7"/>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="319" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
